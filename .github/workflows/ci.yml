name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "whatsapp-booking/**"
      - ".github/workflows/ci.yml"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: whatsapp-booking

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whatsapp-booking/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --tb=short
        # Tests will be skipped gracefully if the tests/ directory doesn't exist yet
        continue-on-error: false
        env:
          WHATSAPP_TOKEN: test-token
          WHATSAPP_PHONE_NUMBER_ID: "000000000"
          WEBHOOK_VERIFY_TOKEN: test-verify
          ANTHROPIC_API_KEY: test-key
          GOOGLE_SHEETS_ID: test-sheet-id
          GOOGLE_SERVICE_ACCOUNT_JSON: "{}"
          BUSINESS_NAME: Test Business
          BUSINESS_SERVICES: Test Service
          BUSINESS_HOURS: Mon-Fri 9am-5pm
          SLOT_DURATION_MINUTES: "60"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./whatsapp-booking
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
